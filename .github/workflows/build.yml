name: Build Sony Android TV Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Generate Native Android TV Project & Java Bridge
        run: |
          mkdir -p android-app/app/src/main/java/com/ahmed/sonytv
          mkdir -p android-app/app/src/main/res/values

          # إعداد ملفات Gradle للبناء
          cat << 'EOF' > android-app/settings.gradle
          rootProject.name = "SonyTVLauncher"
          include ':app'
          EOF

          cat << 'EOF' > android-app/build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.0' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          cat << 'EOF' > android-app/app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace 'com.ahmed.sonytv'
              compileSdkVersion 34
              defaultConfig {
                  applicationId "com.ahmed.sonytv"
                  minSdkVersion 23
                  targetSdkVersion 34
                  versionCode 2
                  versionName "2.0"
              }
              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }
          }
          EOF

          # إنشاء ملف AndroidManifest لدعم Android TV والعمل كلانشر
          cat << 'EOF' > android-app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.ahmed.sonytv">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:label="Sony 4K UI"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # إنشاء كود الجافا الأصلي (MainActivity.java) مع جسر فتح التطبيقات المباشر بدون متصفح
          cat << 'EOF' > android-app/app/src/main/java/com/ahmed/sonytv/MainActivity.java
          package com.ahmed.sonytv;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.KeyEvent;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;
              private static final String UI_URL = "https://ahmed-balamsh.github.io/sony-tv-ui/";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setMediaPlaybackRequiresUserGesture(false);
                  ws.setCacheMode(WebSettings.LOAD_DEFAULT);

                  // ربط الجسر البرمجي المباشر مع كود الجافاسكربت في index.html
                  webView.addJavascriptInterface(new TvBridge(), "AndroidTV");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          if (url.startsWith("intent:")) {
                              try {
                                  Intent intent = Intent.parseUri(url, Intent.URI_INTENT_SCHEME);
                                  String pkg = intent.getPackage();
                                  if (pkg != null) {
                                      launchPackageDirectly(pkg);
                                      return true;
                                  }
                                  startActivity(intent);
                              } catch (Exception e) {}
                              return true;
                          }
                          return false;
                      }
                  });

                  webView.loadUrl(UI_URL);
              }

              private void launchPackageDirectly(String pkg) {
                  try {
                      PackageManager pm = getPackageManager();
                      // 1. محاولة الفتح كبرنامج تلفزيون أندرويد رسمي (Leanback)
                      Intent leanback = pm.getLeanbackLaunchIntentForPackage(pkg);
                      if (leanback != null) {
                          leanback.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(leanback);
                          return;
                      }
                      // 2. محاولة الفتح كبرنامج أندرويد عادي
                      Intent normal = pm.getLaunchIntentForPackage(pkg);
                      if (normal != null) {
                          normal.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(normal);
                      }
                  } catch (Exception e) {}
              }

              public class TvBridge {
                  @JavascriptInterface
                  public void launchApp(String packageName) {
                      launchPackageDirectly(packageName);
                  }

                  @JavascriptInterface
                  public void openSettings() {
                      try {
                          startActivity(new Intent(Settings.ACTION_SETTINGS));
                      } catch (Exception e) {}
                  }

                  @JavascriptInterface
                  public void switchHdmi(int hdmiNum) {
                      try {
                          Uri uri = Uri.parse("content://android.media.tv/passthrough/com.sony.dtv.tvinput.external/.ExternalTvInputService/HW" + hdmiNum);
                          Intent i = new Intent(Intent.ACTION_VIEW, uri);
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(i);
                      } catch (Exception e) {}
                  }
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK) {
                      webView.evaluateJavascript("toggleScreensaver(false);", null);
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }
          }
          EOF

      - name: 5. Compile APK with Gradle
        run: |
          cd android-app
          gradle assembleDebug

      - name: 6. Upload Ready Sony TV APK
        uses: actions/upload-artifact@v4
        with:
          name: Sony-4K-Launcher-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
